<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="La Aventura del Dinero: historias interactivas y animadas para que niños de 9 a 11 años aprendan qué es el dinero, a ahorrar, la inflación y cómo el dinero puede crecer. Con Monedita.">
<meta name="color-scheme" content="light dark">
<title>La Aventura del Dinero</title>
<style>
  :root {
    --font-round: "SF Pro Rounded", "Arial Rounded MT Bold", ui-rounded, "Segoe UI", system-ui, sans-serif;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --sky-1: #8ED6FF; --sky-2: #CFF0FF;
    --ink: #223355; --ink-soft: #5E6E8C;
    --card: #FFFFFF; --card-edge: #E6EDF6;
    --gold: #FFC63D; --gold-deep: #E89B1E;
    --green: #46C877; --green-deep: #2AA75C;
    --coral: #FF7A5C; --purple: #9A86FF; --blue: #43B2FF;
    --shadow: 0 10px 0 rgba(34,51,85,.08), 0 18px 40px rgba(34,51,85,.14);
    --shadow-sm: 0 6px 0 rgba(34,51,85,.07), 0 10px 22px rgba(34,51,85,.12);
    --scene-filter: none;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky-1: #1b2747; --sky-2: #121a30; --ink: #EAF1FF; --ink-soft: #9DABC9;
      --card: #212D49; --card-edge: #32416A; --gold: #FFCF54; --gold-deep: #E0A42A;
      --green: #52D484; --green-deep: #39B86B;
      --shadow: 0 10px 0 rgba(0,0,0,.25), 0 18px 40px rgba(0,0,0,.45);
      --shadow-sm: 0 6px 0 rgba(0,0,0,.22), 0 10px 22px rgba(0,0,0,.4);
      --scene-filter: brightness(.86) saturate(.95);
    }
  }
  :root[data-theme="dark"] {
    --sky-1: #1b2747; --sky-2: #121a30; --ink: #EAF1FF; --ink-soft: #9DABC9;
    --card: #212D49; --card-edge: #32416A; --gold: #FFCF54; --gold-deep: #E0A42A;
    --green: #52D484; --green-deep: #39B86B;
    --shadow: 0 10px 0 rgba(0,0,0,.25), 0 18px 40px rgba(0,0,0,.45);
    --shadow-sm: 0 6px 0 rgba(0,0,0,.22), 0 10px 22px rgba(0,0,0,.4);
    --scene-filter: brightness(.86) saturate(.95);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: var(--font-body); color: var(--ink);
    background: linear-gradient(180deg, var(--sky-1), var(--sky-2) 60%);
    overflow-x: hidden; -webkit-font-smoothing: antialiased; user-select: none;
  }
  h1, h2, h3, .round { font-family: var(--font-round); font-weight: 800; }
  .app { max-width: 820px; margin: 0 auto; padding: 0 16px 40px; position: relative; z-index: 1; }
  .defs { position: absolute; width: 0; height: 0; overflow: hidden; }

  .bar { display: flex; align-items: center; gap: 10px; padding: 14px 4px 6px; }
  .bar .logo { font-family: var(--font-round); font-weight: 800; font-size: 1.1rem; margin-right: auto; display: flex; align-items: center; gap: 8px; }
  .bar .logo .dot { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE38A, #E89B1E); box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); }
  .iconbtn { width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer; background: var(--card); color: var(--ink); font-size: 1.2rem; box-shadow: var(--shadow-sm); display: grid; place-items: center; transition: transform .12s; }
  .iconbtn:active { transform: translateY(3px) scale(.96); }
  .iconbtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

  /* HOME */
  .hero { text-align: center; padding: 6px 0 6px; }
  .hero h1 { font-size: clamp(2.1rem, 8vw, 3.4rem); margin: 0 0 2px; line-height: 1.05; text-wrap: balance; }
  .hero h1 .amar { color: var(--gold-deep); }
  .hero .sub { font-size: 1.05rem; color: var(--ink-soft); margin: 0 auto 6px; max-width: 32ch; font-weight: 600; }
  .mascot { width: 150px; height: 150px; margin: 0 auto; animation: floaty 3.4s ease-in-out infinite; }
  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
  .progress-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border-radius: 999px; padding: 8px 16px; box-shadow: var(--shadow-sm); font-weight: 700; font-family: var(--font-round); margin: 6px auto 16px; }
  .progress-chip .stars { letter-spacing: 2px; color: var(--gold-deep); }

  .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (max-width: 520px) { .cards { grid-template-columns: 1fr; } }
  .card { position: relative; border: none; cursor: pointer; text-align: left; border-radius: 26px; padding: 20px; color: #fff; overflow: hidden; box-shadow: var(--shadow); transition: transform .14s; font-family: var(--font-round); min-height: 158px; display: flex; flex-direction: column; justify-content: flex-end; }
  .card:hover { transform: translateY(-3px) rotate(-.4deg); }
  .card:active { transform: translateY(4px) scale(.99); }
  .card:focus-visible { outline: 4px solid #fff; outline-offset: -8px; }
  .card .cnum { position: absolute; top: 14px; left: 18px; font-size: .85rem; font-weight: 800; opacity: .9; letter-spacing: .1em; }
  .card .cart { position: absolute; top: -4px; right: -4px; width: 128px; height: 128px; }
  .card h3 { font-size: 1.32rem; margin: 0 0 3px; line-height: 1.05; text-shadow: 0 2px 0 rgba(0,0,0,.14); position: relative; }
  .card p { font-size: .9rem; margin: 0; font-weight: 600; font-family: var(--font-body); position: relative; }
  .card .done-badge { position: absolute; top: 12px; right: 14px; font-size: 1.4rem; display: none; z-index: 2; }
  .card.done .done-badge { display: block; }
  .card.c1 { background: linear-gradient(145deg, #5BC0FF, #2E96E8); }
  .card.c2 { background: linear-gradient(145deg, #FFC24B, #F0982A); }
  .card.c3 { background: linear-gradient(145deg, #FF8A6B, #ED5F43); }
  .card.c4 { background: linear-gradient(145deg, #63D58E, #2FB36B); }
  .home-foot { text-align: center; color: var(--ink-soft); font-size: .85rem; margin-top: 22px; font-weight: 600; }

  /* STAGE */
  .stage { display: none; }
  .stage.on { display: block; animation: popin .35s cubic-bezier(.2,1.2,.4,1); }
  @keyframes popin { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
  .story-head { display: flex; align-items: center; gap: 10px; margin: 4px 0 10px; }
  .dots { display: flex; gap: 7px; margin-left: auto; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--card-edge); display: block; transition: background .2s, transform .2s; }
  .dots i.on { background: var(--gold); transform: scale(1.25); }
  .scene { border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; border: 4px solid var(--card); background: #BFE6FF; transition: filter .25s; }
  .scene svg.scene-svg { display: block; width: 100%; height: auto; filter: var(--scene-filter); }
  .scene.scene-in { animation: sceneIn .45s cubic-bezier(.2,1.2,.4,1); }
  @keyframes sceneIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }

  .bubble { display: flex; gap: 12px; align-items: flex-start; margin: 16px 2px 8px; }
  .bubble .mini { width: 66px; height: 66px; flex: none; }
  .bubble .say { background: var(--card); border-radius: 20px; padding: 14px 18px; box-shadow: var(--shadow-sm); font-size: 1.12rem; font-weight: 600; line-height: 1.42; position: relative; flex: 1; }
  .bubble .say::before { content: ""; position: absolute; left: -9px; top: 20px; width: 18px; height: 18px; background: var(--card); transform: rotate(45deg); border-radius: 4px; }
  .bubble .say b { color: var(--gold-deep); }
  .controls { display: flex; gap: 12px; align-items: center; justify-content: center; margin: 10px 2px 4px; flex-wrap: wrap; }
  .btn { font-family: var(--font-round); font-weight: 800; font-size: 1.1rem; border: none; cursor: pointer; color: #fff; background: linear-gradient(180deg, var(--green), var(--green-deep)); padding: 15px 28px; border-radius: 18px; box-shadow: 0 6px 0 var(--green-deep), var(--shadow-sm); transition: transform .1s, box-shadow .1s; }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--green-deep); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .btn.alt { background: linear-gradient(180deg, #FFC63D, #E89B1E); box-shadow: 0 6px 0 #C98213, var(--shadow-sm); }
  .btn.alt:active { box-shadow: 0 1px 0 #C98213; }
  .btn.ghost { background: var(--card); color: var(--ink); box-shadow: 0 6px 0 var(--card-edge), var(--shadow-sm); }
  .btn.sm { font-size: .98rem; padding: 12px 20px; }
  .btn[disabled] { opacity: .45; filter: grayscale(.4); pointer-events: none; }
  .hint { text-align: center; color: var(--ink-soft); font-weight: 700; font-family: var(--font-round); margin: 4px 0 0; font-size: .98rem; min-height: 1.4em; }

  .bins { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 6px 2px; }
  .bin { border: none; cursor: pointer; border-radius: 22px; padding: 14px 10px 12px; text-align: center; background: var(--card); box-shadow: var(--shadow-sm); font-family: var(--font-round); font-weight: 800; color: var(--ink); transition: transform .1s; }
  .bin:active { transform: translateY(4px) scale(.97); }
  .bin:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .bin .emoji { font-size: 2.2rem; display: block; line-height: 1; }
  .bin .lab { font-size: 1rem; margin-top: 6px; display: block; }
  .bin .cnt { display: inline-block; margin-top: 6px; background: #FFC63D; color: #5a3d00; border-radius: 999px; padding: 2px 12px; font-size: .95rem; min-width: 42px; }
  .bin.save .cnt { background: #46C877; color: #063d1e; }
  .chip { display: inline-flex; gap: 6px; background: var(--card); border-radius: 999px; padding: 8px 16px; box-shadow: var(--shadow-sm); font-weight: 700; font-family: var(--font-round); }

  .ylabel { text-align: center; font-family: var(--font-round); font-weight: 800; font-size: 1.15rem; margin: 4px 0 2px; }
  input[type=range].big { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; border-radius: 999px; background: linear-gradient(90deg, #C9A46A, #FFC63D 60%, #FF7A5C); outline: none; margin: 12px 0; }
  input[type=range].big::-webkit-slider-thumb { -webkit-appearance: none; width: 42px; height: 42px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE38A, #E89B1E); border: 4px solid #fff; box-shadow: var(--shadow-sm); cursor: grab; }
  input[type=range].big::-moz-range-thumb { width: 42px; height: 42px; border-radius: 50%; background: #FFC63D; border: 4px solid #fff; cursor: grab; }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; display: none; }
  .overlay { position: fixed; inset: 0; z-index: 70; display: none; place-items: center; padding: 20px; background: rgba(20,30,55,.55); backdrop-filter: blur(3px); }
  .overlay.on { display: grid; animation: fadein .3s; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .reward { background: var(--card); border-radius: 30px; padding: 22px 26px 26px; text-align: center; max-width: 390px; width: 100%; box-shadow: var(--shadow); animation: popin .45s cubic-bezier(.2,1.3,.4,1); }
  .reward .rm { width: 110px; height: 110px; margin: 0 auto; }
  .reward .bigstar { font-size: 3.2rem; line-height: 1; animation: pop .6s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes pop { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.25) rotate(8deg); } 100% { transform: scale(1); } }
  .reward h2 { font-size: 1.6rem; margin: 6px 0 4px; }
  .reward p { color: var(--ink-soft); font-weight: 600; margin: 0 0 18px; font-size: 1.05rem; }

  /* ===== SVG ANIMATIONS ===== */
  .bob { animation: bob 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes bob { 0%,100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-2.5px) scaleY(1.015); } }
  .hop { animation: hop 1s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes hop { 0%,100% { transform: translateY(0) scale(1,1); } 15% { transform: translateY(0) scale(1.06,.93); } 45% { transform: translateY(-14px) scale(.97,1.04); } 70% { transform: translateY(0) scale(1.04,.96); } }
  .blink { animation: blink 4.2s infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
  .wave { animation: wave 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 100%; }
  @keyframes wave { 0%,100% { transform: rotate(-14deg); } 50% { transform: rotate(16deg); } }
  .armsway { animation: armsway 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 0%; }
  .armsway-l { animation: armsway 2.8s ease-in-out infinite reverse; transform-box: fill-box; transform-origin: 100% 0%; }
  @keyframes armsway { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(6deg); } }
  .hammer { animation: hammer .9s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 0%; }
  @keyframes hammer { 0%,100% { transform: rotate(0); } 45% { transform: rotate(-38deg); } 60% { transform: rotate(4deg); } }
  .swing { animation: swing 1.7s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0%; }
  @keyframes swing { 0%,100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
  .dangle { animation: swing 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0%; }
  .sway { animation: sway 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  .wiggle { animation: wiggle 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes wiggle { 0%,100% { transform: rotate(-3deg) scale(1); } 50% { transform: rotate(3deg) scale(1.03); } }
  .wag { animation: wag .7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 100% 100%; }
  @keyframes wag { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
  .spin { animation: spin 26s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .drift { animation: drift 46s linear infinite; }
  @keyframes drift { from { transform: translateX(-150px); } to { transform: translateX(550px); } }
  .driftwin { animation: driftwin 16s linear infinite; }
  @keyframes driftwin { from { transform: translateX(-30px); } to { transform: translateX(120px); } }
  .flap { animation: flap .42s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.3); } }
  .wingL { animation: wing .22s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 100% 50%; }
  .wingR { animation: wing .22s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 0% 50%; }
  @keyframes wing { from { transform: scaleX(1); } to { transform: scaleX(.25); } }
  .bfly { animation: bfly 10s ease-in-out infinite; }
  @keyframes bfly { 0%,100% { transform: translate(0,0); } 25% { transform: translate(44px,-26px); } 50% { transform: translate(86px,-4px); } 75% { transform: translate(36px,14px); } }
  .flipcoin { animation: flipcoin 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes flipcoin { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(.1); } }
  .twinkle { animation: twinkle 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes twinkle { 0%,100% { transform: scale(.5) rotate(0); opacity: .3; } 50% { transform: scale(1.1) rotate(45deg); opacity: 1; } }
  .fall { animation: fall 2.6s ease-in infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes fall { 0% { transform: translateY(-70px) rotate(0); opacity: 0; } 12% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(60px) rotate(320deg); opacity: 0; } }
  .slotdrop { animation: slotdrop 2.2s ease-in infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes slotdrop { 0% { transform: translateY(-44px) scaleX(1); opacity: 0; } 15% { opacity: 1; } 55% { transform: translateY(-8px) scaleX(.25); opacity: 1; } 68% { transform: translateY(4px) scaleX(1); opacity: 0; } 100% { transform: translateY(4px); opacity: 0; } }
  .inflate { animation: inflate 2.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes inflate { from { transform: scale(.55); } to { transform: scale(1.08); } }
  .shrinkfade { animation: shrinkfade 2.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes shrinkfade { from { transform: scale(1); opacity: 1; } to { transform: scale(.62); opacity: .35; } }
  .zz { animation: zz 3s ease-in infinite; }
  @keyframes zz { 0% { transform: translate(0,0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(16px,-34px); opacity: 0; } }
  .eat { animation: eat 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes eat { 0%,10% { transform: scale(1); opacity: 1; } 60% { transform: scale(.05); opacity: 1; } 61%,85% { transform: scale(.05); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .pulse { animation: pulse 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  .talk { animation: talk .28s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes talk { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
  .moon { animation: bob 5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  /* one-shot effects (re-triggered from JS) */
  .headwrap, .jumpwrap, .pigj, .signwrap { transform-box: fill-box; transform-origin: 50% 100%; }
  .signwrap { transform-origin: 50% 50%; }
  .shake { animation: shake .45s ease-in-out 3; }
  @keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-13deg); } 75% { transform: rotate(13deg); } }
  .jump { animation: jump .7s cubic-bezier(.3,1.6,.5,1) 2; }
  @keyframes jump { 0%,100% { transform: translateY(0) scale(1,1); } 20% { transform: translateY(0) scale(1.1,.88); } 50% { transform: translateY(-24px) scale(.95,1.06); } }
  .jiggle { animation: jiggle .55s ease-out; }
  @keyframes jiggle { 0% { transform: scale(1,1); } 30% { transform: scale(1.16,.84); } 60% { transform: scale(.93,1.09); } 100% { transform: scale(1,1); } }
  .bump { animation: bump .4s ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.3) rotate(-4deg); } 100% { transform: scale(1); } }
  .popin { animation: popsvg .55s cubic-bezier(.2,1.5,.4,1) both; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes popsvg { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .pigs { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .5s cubic-bezier(.3,1.7,.5,1); }
  .treescale { transform-box: fill-box; transform-origin: 50% 100%; transition: transform 1s cubic-bezier(.3,1.45,.5,1); }
  .cantilt { transform-box: fill-box; transform-origin: 0% 60%; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
  }
</style>
</head>

<!-- Definiciones SVG compartidas -->
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="gold" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#FFE9A3"/><stop offset="50%" stop-color="#FFC63D"/><stop offset="100%" stop-color="#E89B1E"/></radialGradient>
    <radialGradient id="sunG" cx="40%" cy="35%" r="70%"><stop offset="0%" stop-color="#FFF3B0"/><stop offset="100%" stop-color="#FFC93D"/></radialGradient>
    <radialGradient id="pigG" cx="40%" cy="35%" r="75%"><stop offset="0%" stop-color="#FFD3E6"/><stop offset="60%" stop-color="#FF9ECb"/><stop offset="100%" stop-color="#F27FB0"/></radialGradient>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7FD0FF"/><stop offset="100%" stop-color="#D9F3FF"/></linearGradient>
    <linearGradient id="grassG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7DDE9B"/><stop offset="100%" stop-color="#43BD72"/></linearGradient>
    <linearGradient id="nightG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1B2550"/><stop offset="100%" stop-color="#3B4A8A"/></linearGradient>
    <pattern id="dotsP" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#FFF1DA"/><circle cx="11" cy="11" r="2.4" fill="#FFD9A8"/></pattern>
    <pattern id="starsP" width="34" height="34" patternUnits="userSpaceOnUse"><rect width="34" height="34" fill="#2E3A6E"/><circle cx="8" cy="9" r="1.3" fill="#8D9BE0"/><circle cx="25" cy="24" r="1" fill="#8D9BE0"/></pattern>
    <clipPath id="winC"><rect x="5" y="5" width="86" height="64" rx="4"/></clipPath>
    <filter id="sepiaF"><feColorMatrix type="matrix" values=".39 .77 .19 0 0  .35 .69 .17 0 0  .27 .53 .13 0 0  0 0 0 1 0"/></filter>
    <filter id="softSh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#223355" flood-opacity=".18"/></filter>
  </defs>
</svg>

    var year = 0, coins = 1, busy = false;
    var SPOUT = [162, 151], BASE = [252, 196];
    $('scene').innerHTML = garden(
      person(ext(LUCIA, { x: 100, y: 214, s: .95, id: 'lu', arm: 'hold', held: wateringCan('can') })) +
      '<g transform="translate(258,206)"><g id="treeS" class="treescale" style="transform:scale(0.001)">' + bigTree({ idp: 'gt', coins: 0 }) + '</g></g>' +
      '<g transform="translate(258,206)">' + sprout('sprout') + '</g><g id="shower"></g>');
    box().innerHTML =
      '<div style="text-align:center;margin:2px 0 6px"><span class="chip">Año <b id="gy" style="color:var(--green-deep)">0</b> · Monedas <b id="gc" style="color:var(--gold-deep)">1</b></span></div>' +
      '<div class="controls"><button class="btn" id="water">💧 Regar (pasa 1 año)</button></div><p class="hint" id="gHint">Riega la moneda plantada… ¡a ver qué pasa!</p>';
    $('water').onclick = function () {
      if (busy || year >= 6) return; busy = true;
      var can = $('can');
      if (can && can.animate && !reduce) can.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(32deg)', offset: .25 }, { transform: 'rotate(32deg)', offset: .75 }, { transform: 'rotate(0deg)' }], { duration: 1000, easing: 'ease-in-out' });
      var drops = [0, 1, 2, 3].map(function (i) { return wait(160 + i * 130).then(function () { if (alive()) { sDrop(); return fly(drop(), SPOUT, [BASE[0] - 8 + i * 6, BASE[1]], { arc: 8, rot: 0, dur: 520, peak: 1 }); } }); });
      Promise.all(drops).then(function () {
        if (!alive()) return;
        year++; coins *= 2;
        $('gy').textContent = year; $('gc').textContent = coins;
        $('sprout').style.display = 'none';
        $('treeS').style.transform = 'scale(' + (.28 + .72 * year / 6).toFixed(3) + ')';
        var c = $('gtc' + (year - 1)); if (c) { c.style.display = ''; replay(c, 'popin'); }
        sCoin();
        if (year < 6) { $('gHint').innerHTML = '¡Está creciendo! Ya tienes <b>' + coins + '</b> monedas: cada año, <b>el doble</b>. Riega otra vez 💧'; busy = false; }
        else {
          var sh = ''; [[200, 60], [232, 50], [262, 66], [292, 46], [320, 62], [244, 30]].forEach(function (p, i) { sh += fallingCoin(p[0], p[1], 6.5, (i * .4).toFixed(1), 2.2); });
          $('shower').innerHTML = sh; confetti(1400); sStar();
          $('gHint').innerHTML = '🌳 ¡<b>' + coins + ' monedas</b>! Empezaste con 1. Esto es el <b>interés compuesto</b>: lo que crece… ¡también crece!';
          var w = $('water'); w.setAttribute('disabled', 'true'); w.textContent = '¡Ya es enorme! 🌳';
          unlockNext();
        }
      });
    };
  };

  /* ======================= MOTOR ======================= */
  var cur = 0, step = 0, canAdvance = true, RID = 0;

  function renderHome() {
    RID++;
    $('stage').classList.remove('on'); $('home').style.display = '';
    $('heroMascot').innerHTML = monedita(starCount() === STORIES.length ? 'wow' : 'happy', true);
    var n = starCount(), s = ''; for (var i = 0; i < STORIES.length; i++) s += i < n ? '★' : '☆';
    $('homeStars').textContent = s;
    var c = $('cards'); c.innerHTML = '';
    STORIES.forEach(function (st, i) {
      var b = document.createElement('button');
      b.className = 'card ' + st.cls + (starsMem[st.id] ? ' done' : '');
      b.setAttribute('aria-label', 'Historia ' + (i + 1) + ': ' + st.title);
      b.innerHTML = '<span class="cnum">HISTORIA ' + (i + 1) + '</span><span class="cart">' + st.cardArt() + '</span><span class="done-badge">⭐</span><h3>' + st.title + '</h3><p>' + st.short + '</p>';
      b.addEventListener('click', function () { sPop(); openStory(i); });
      c.appendChild(b);
    });
    window.scrollTo(0, 0);
  }
  function openStory(i) {
    cur = i; step = 0;
    $('home').style.display = 'none'; $('stage').classList.add('on');
    $('storyTitle').textContent = STORIES[i].title;
    renderStep(); window.scrollTo(0, 0);
  }
  function renderStep() {
    RID++; var my = RID; var alive = function () { return my === RID; };
    var s = STORIES[cur].steps[step];
    var d = $('dots'); d.innerHTML = '';
    STORIES[cur].steps.forEach(function (_, i) { var e = document.createElement('i'); if (i === step) e.className = 'on'; d.appendChild(e); });
    $('miniMascot').innerHTML = monedita(s.mood || 'happy', false);
    $('say').innerHTML = s.say;
    $('scene').style.filter = '';
    $('scene').innerHTML = s.scene ? s.scene() : '';
    replay($('scene'), 'scene-in');
    $('interaction').innerHTML = '';
    canAdvance = !s.ui;
    renderControls();
    if (s.ui) INTERACT[s.ui](alive);
  }
  function renderControls() {
    var c = $('controls'); c.innerHTML = '';
    var last = step === STORIES[cur].steps.length - 1;
    var next = document.createElement('button');
    next.className = 'btn' + (last ? ' alt' : ''); next.id = 'nextBtn';
    next.textContent = last ? '¡Terminar! ⭐' : 'Siguiente →';
    if (!canAdvance) next.setAttribute('disabled', 'true');
    next.addEventListener('click', advance); c.appendChild(next);
  }
  function unlockNext() { canAdvance = true; var n = $('nextBtn'); if (n) n.removeAttribute('disabled'); }
  function advance() {
    if (!canAdvance) return; sPop();
    if (step < STORIES[cur].steps.length - 1) { step++; renderStep(); window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); }
    else finishStory();
  }
  function finishStory() {
    var st = STORIES[cur], already = starsMem[st.id];
    setStar(st.id); sStar(); confetti();
    var all = starCount() === STORIES.length;
    $('reward').innerHTML = '<div class="rm">' + monedita('wow', true) + '</div><div class="bigstar">⭐</div>' +
      '<h2>' + (already ? '¡Muy bien otra vez!' : '¡Estrella conseguida!') + '</h2><p>' + st.starText + '</p>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">' + (all ? '' : '<button class="btn sm" id="rNext">Siguiente historia →</button>') +
      '<button class="btn ghost sm" id="rHome">Ir al inicio 🏠</button></div>';
    $('overlay').classList.add('on');
    var rn = $('rNext'); if (rn) rn.addEventListener('click', function () { closeOverlay(); openStory((cur + 1) % STORIES.length); });
    $('rHome').addEventListener('click', function () { closeOverlay(); if (all) celebrate(); else renderHome(); });
  }
  function closeOverlay() { $('overlay').classList.remove('on'); }
  function celebrate() {
    renderHome(); confetti(2200); sStar();
    $('reward').innerHTML = '<div class="rm">' + monedita('wow', true) + '</div><div class="bigstar">🏆</div><h2>¡Eres un experto del dinero!</h2>' +
      '<p>Has completado las 4 historias: ya sabes qué es el dinero, cómo ahorrar, por qué suben los precios y cómo el dinero crece. ¡Choca esos cinco! ✋</p>' +
      '<button class="btn sm" id="rHome2">¡Genial! 🏠</button>';
    $('overlay').classList.add('on');
    $('rHome2').addEventListener('click', closeOverlay);
  }

  /* ======================= CONFETI ======================= */
  var cc = $('confetti'), ccx = cc.getContext('2d'), parts = [], raf = null, stopAt = 0;
  function sizeCC() { cc.width = window.innerWidth; cc.height = window.innerHeight; }
  sizeCC();
  function confetti(ms) {
    if (reduce) return;
    stopAt = Date.now() + (ms || 1200); cc.style.display = 'block';
    var cols = ['#FFC63D', '#FF7A5C', '#46C877', '#43B2FF', '#9A86FF', '#FF9ECb'];
    for (var i = 0; i < 90; i++) parts.push({ x: Math.random() * cc.width, y: -20 - Math.random() * cc.height * .3, r: 4 + Math.random() * 7, c: cols[i % cols.length], vy: 2 + Math.random() * 4, vx: -2 + Math.random() * 4, a: Math.random() * 6, va: -.2 + Math.random() * .4 });
    if (!raf) loop();
  }
  function loop() {
    ccx.clearRect(0, 0, cc.width, cc.height);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i]; p.x += p.vx; p.y += p.vy; p.a += p.va; p.vy += .05;
      ccx.save(); ccx.translate(p.x, p.y); ccx.rotate(p.a); ccx.fillStyle = p.c; ccx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); ccx.restore();
      if (p.y > cc.height + 30) parts.splice(i, 1);
    }
    if (parts.length || Date.now() < stopAt) raf = requestAnimationFrame(loop);
    else { raf = null; cc.style.display = 'none'; }
  }

  /* ======================= CIELO AMBIENTAL ======================= */
  var sky = $('sky'), sx = sky.getContext('2d'), floats = [];
  function sizeSky() { sky.width = window.innerWidth; sky.height = window.innerHeight; }
  sizeSky(); window.addEventListener('resize', function () { sizeCC(); sizeSky(); });
  for (var k = 0; k < 14; k++) floats.push({ x: Math.random(), y: Math.random(), r: 8 + Math.random() * 14, s: .08 + Math.random() * .12, t: Math.random() * 6 });
  function skyLoop() {
    sx.clearRect(0, 0, sky.width, sky.height);
    floats.forEach(function (f) {
      f.y -= f.s / 140; f.t += .01; if (f.y < -.05) { f.y = 1.05; f.x = Math.random(); }
      var x = f.x * sky.width + Math.sin(f.t) * 14, y = f.y * sky.height;
      sx.globalAlpha = .45; sx.beginPath(); sx.arc(x, y, f.r, 0, Math.PI * 2); sx.fillStyle = '#FFC63D'; sx.fill();
      sx.globalAlpha = .85; sx.fillStyle = '#E89B1E'; sx.font = 'bold ' + f.r + 'px sans-serif'; sx.textAlign = 'center'; sx.textBaseline = 'middle'; sx.fillText('€', x, y + 1);
    });
    sx.globalAlpha = 1;
    if (!reduce) requestAnimationFrame(skyLoop);
  }
  skyLoop();

  /* ======================= TEMA, SONIDO, VOLVER ======================= */
  try { var savedT = localStorage.getItem('aventura:theme'); if (savedT) document.documentElement.setAttribute('data-theme', savedT); } catch (e) {}
  function curDark() { var t = document.documentElement.getAttribute('data-theme'); if (t) return t === 'dark'; return window.matchMedia('(prefers-color-scheme: dark)').matches; }
  function syncTheme() { $('themeBtn').textContent = curDark() ? '☀️' : '🌙'; }
  $('themeBtn').addEventListener('click', function () {
    var nt = curDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', nt);
    try { localStorage.setItem('aventura:theme', nt); } catch (e) {}
    syncTheme(); sPop();
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);
  syncTheme();
  function syncSound() { $('soundBtn').textContent = soundOn ? '🔊' : '🔇'; }
  $('soundBtn').addEventListener('click', function () { soundOn = !soundOn; try { localStorage.setItem('aventura:sound', soundOn ? '1' : '0'); } catch (e) {} syncSound(); if (soundOn) sCoin(); });
  syncSound();
  $('backBtn').addEventListener('click', function () { sPop(); renderHome(); });

  renderHome();
})();
</script>
</body>
</html>
