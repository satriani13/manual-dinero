<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="La Aventura del Dinero: historias interactivas para que niños de 9 a 11 años aprendan qué es el dinero, a ahorrar, la inflación y cómo el dinero puede crecer. Con Monedita.">
<meta name="color-scheme" content="light dark">
<title>La Aventura del Dinero</title>
<style>
  :root {
    --font-round: "SF Pro Rounded", "Arial Rounded MT Bold", ui-rounded, "Baloo 2", "Segoe UI", system-ui, sans-serif;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    --sky-1: #8ED6FF;
    --sky-2: #CFF0FF;
    --ground: #8BE0A0;
    --ground-2: #6FD38C;
    --ink: #223355;
    --ink-soft: #5E6E8C;
    --card: #FFFFFF;
    --card-edge: #E6EDF6;
    --gold: #FFC63D;
    --gold-deep: #E89B1E;
    --green: #46C877;
    --green-deep: #2AA75C;
    --coral: #FF7A5C;
    --coral-deep: #E85A3C;
    --purple: #9A86FF;
    --purple-deep: #7A63F0;
    --blue: #43B2FF;
    --pink: #FF9ECb;
    --shadow: 0 10px 0 rgba(34,51,85,.08), 0 18px 40px rgba(34,51,85,.14);
    --shadow-sm: 0 6px 0 rgba(34,51,85,.07), 0 10px 22px rgba(34,51,85,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky-1: #1b2747; --sky-2: #121a30; --ground: #1f3a2c; --ground-2: #18402a;
      --ink: #EAF1FF; --ink-soft: #9DABC9; --card: #212D49; --card-edge: #32416A;
      --gold: #FFCF54; --gold-deep: #E0A42A; --green: #52D484; --green-deep: #39B86B;
      --coral: #FF8A6E; --coral-deep: #E96a4c; --purple: #AD9BFF; --purple-deep: #8D78FF;
      --blue: #5DBCFF; --pink: #FFAAD4;
      --shadow: 0 10px 0 rgba(0,0,0,.25), 0 18px 40px rgba(0,0,0,.45);
      --shadow-sm: 0 6px 0 rgba(0,0,0,.22), 0 10px 22px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --sky-1: #1b2747; --sky-2: #121a30; --ground: #1f3a2c; --ground-2: #18402a;
    --ink: #EAF1FF; --ink-soft: #9DABC9; --card: #212D49; --card-edge: #32416A;
    --gold: #FFCF54; --gold-deep: #E0A42A; --green: #52D484; --green-deep: #39B86B;
    --coral: #FF8A6E; --coral-deep: #E96a4c; --purple: #AD9BFF; --purple-deep: #8D78FF;
    --blue: #5DBCFF; --pink: #FFAAD4;
    --shadow: 0 10px 0 rgba(0,0,0,.25), 0 18px 40px rgba(0,0,0,.45);
    --shadow-sm: 0 6px 0 rgba(0,0,0,.22), 0 10px 22px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--font-body); color: var(--ink);
    background: linear-gradient(180deg, var(--sky-1), var(--sky-2) 60%);
    min-height: 100%; overflow-x: hidden; -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  h1, h2, h3, .round { font-family: var(--font-round); font-weight: 800; }

  .app { max-width: 820px; margin: 0 auto; padding: 0 16px 40px; position: relative; z-index: 1; }

  /* top bar */
  .bar { display: flex; align-items: center; gap: 10px; padding: 14px 4px 6px; }
  .bar .logo { font-family: var(--font-round); font-weight: 800; font-size: 1.1rem; color: var(--ink); margin-right: auto; display: flex; align-items: center; gap: 8px; }
  .bar .logo .dot { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--gold), var(--gold-deep)); box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); display: inline-block; }
  .iconbtn {
    width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--card); color: var(--ink); font-size: 1.2rem; box-shadow: var(--shadow-sm);
    display: grid; place-items: center; transition: transform .12s;
  }
  .iconbtn:active { transform: translateY(3px) scale(.96); box-shadow: 0 3px 0 rgba(34,51,85,.1); }
  .iconbtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* ambient canvas */
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

  /* ===== HOME ===== */
  .hero { text-align: center; padding: 10px 0 6px; position: relative; }
  .hero h1 { font-size: clamp(2.1rem, 8vw, 3.4rem); margin: 4px 0 2px; color: var(--ink); line-height: 1.05; text-wrap: balance; }
  .hero h1 .amar { color: var(--gold-deep); }
  .hero .sub { font-size: 1.05rem; color: var(--ink-soft); margin: 0 auto 6px; max-width: 30ch; font-weight: 600; }
  .mascot-wrap { display: grid; place-items: center; margin: 2px 0; }
  .mascot { width: 128px; height: 128px; animation: floaty 3.2s ease-in-out infinite; }
  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-12px) rotate(2deg); } }

  .progress-chip {
    display: inline-flex; align-items: center; gap: 8px; background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 8px 16px; box-shadow: var(--shadow-sm); font-weight: 700; font-family: var(--font-round);
    margin: 6px auto 16px;
  }
  .progress-chip .stars { letter-spacing: 2px; }

  .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (max-width: 520px) { .cards { grid-template-columns: 1fr; } }
  .card {
    position: relative; border: none; cursor: pointer; text-align: left;
    border-radius: 26px; padding: 20px; color: #fff; overflow: hidden;
    box-shadow: var(--shadow); transition: transform .14s;
    font-family: var(--font-round); min-height: 150px; display: flex; flex-direction: column; justify-content: flex-end;
  }
  .card:active { transform: translateY(4px) scale(.99); }
  .card:focus-visible { outline: 4px solid #fff; outline-offset: -8px; }
  .card .cnum { position: absolute; top: 14px; left: 18px; font-size: .85rem; font-weight: 800; opacity: .85; letter-spacing: .1em; }
  .card .cart { position: absolute; top: -6px; right: -6px; width: 118px; height: 118px; opacity: .95; }
  .card h3 { font-size: 1.32rem; margin: 0 0 3px; line-height: 1.05; text-shadow: 0 2px 0 rgba(0,0,0,.12); }
  .card p { font-size: .9rem; margin: 0; font-weight: 600; opacity: .95; font-family: var(--font-body); }
  .card .done-badge { position: absolute; top: 12px; right: 14px; font-size: 1.4rem; filter: drop-shadow(0 2px 2px rgba(0,0,0,.2)); display: none; }
  .card.done .done-badge { display: block; }
  .card.c1 { background: linear-gradient(145deg, #5BC0FF, #2E96E8); }
  .card.c2 { background: linear-gradient(145deg, #FFC24B, #F0982A); }
  .card.c3 { background: linear-gradient(145deg, #FF8A6B, #ED5F43); }
  .card.c4 { background: linear-gradient(145deg, #63D58E, #2FB36B); }

  .home-foot { text-align: center; color: var(--ink-soft); font-size: .82rem; margin-top: 22px; font-weight: 600; }

  /* ===== STORY STAGE ===== */
  .stage { display: none; }
  .stage.on { display: block; animation: popin .35s cubic-bezier(.2,1.2,.4,1); }
  @keyframes popin { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }

  .story-head { display: flex; align-items: center; gap: 10px; margin: 4px 0 10px; }
  .dots { display: flex; gap: 7px; margin-left: auto; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--card-edge); display: block; transition: background .2s, transform .2s; }
  .dots i.on { background: var(--gold); transform: scale(1.25); }

  .scene {
    background: linear-gradient(180deg, color-mix(in srgb, var(--blue) 22%, var(--card)), var(--card));
    border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; position: relative;
    border: 3px solid var(--card);
  }
  .scene svg.scene-svg { display: block; width: 100%; height: auto; }

  .bubble {
    display: flex; gap: 12px; align-items: flex-start; margin: 16px 2px 8px;
  }
  .bubble .mini { width: 60px; height: 60px; flex: none; animation: floaty 3s ease-in-out infinite; }
  .bubble .say {
    background: var(--card); border-radius: 20px; padding: 14px 18px; box-shadow: var(--shadow-sm);
    font-size: 1.12rem; font-weight: 600; line-height: 1.4; position: relative; flex: 1;
  }
  .bubble .say::before {
    content: ""; position: absolute; left: -9px; top: 20px; width: 18px; height: 18px;
    background: var(--card); transform: rotate(45deg); border-radius: 4px;
  }
  .bubble .say b { color: var(--gold-deep); }

  .controls { display: flex; gap: 12px; align-items: center; justify-content: center; margin: 10px 2px 4px; flex-wrap: wrap; }
  .btn {
    font-family: var(--font-round); font-weight: 800; font-size: 1.1rem; border: none; cursor: pointer;
    color: #fff; background: linear-gradient(180deg, var(--green), var(--green-deep));
    padding: 15px 30px; border-radius: 18px; box-shadow: 0 6px 0 var(--green-deep), var(--shadow-sm);
    transition: transform .1s, box-shadow .1s;
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--green-deep); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .btn.alt { background: linear-gradient(180deg, var(--gold), var(--gold-deep)); box-shadow: 0 6px 0 var(--gold-deep), var(--shadow-sm); }
  .btn.alt:active { box-shadow: 0 1px 0 var(--gold-deep); }
  .btn.ghost { background: var(--card); color: var(--ink); box-shadow: 0 6px 0 var(--card-edge), var(--shadow-sm); }
  .btn.ghost:active { box-shadow: 0 1px 0 var(--card-edge); }
  .btn.sm { font-size: .98rem; padding: 12px 20px; }
  .btn[disabled] { opacity: .45; filter: grayscale(.4); pointer-events: none; }

  .hint { text-align: center; color: var(--ink-soft); font-weight: 700; font-family: var(--font-round); margin: 2px 0 0; font-size: .96rem; }

  /* interaction: coin sort */
  .bins { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 6px 2px; }
  .bin {
    border: none; cursor: pointer; border-radius: 22px; padding: 16px 10px 14px; text-align: center;
    background: var(--card); box-shadow: var(--shadow-sm); font-family: var(--font-round); font-weight: 800; color: var(--ink);
    transition: transform .1s; position: relative;
  }
  .bin:active { transform: translateY(4px) scale(.98); }
  .bin:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .bin .emoji { font-size: 2.3rem; display: block; line-height: 1; }
  .bin .lab { font-size: 1rem; margin-top: 6px; }
  .bin .cnt { display: inline-block; margin-top: 6px; background: var(--gold); color: #5a3d00; border-radius: 999px; padding: 2px 12px; font-size: .95rem; min-width: 42px; }
  .bin.save .cnt { background: var(--green); color: #063d1e; }
  .coinpile { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; min-height: 56px; margin: 4px 0 8px; }
  .pcoin { width: 44px; height: 44px; animation: dropin .4s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes dropin { from { transform: translateY(-40px) rotate(-30deg); opacity: 0; } to { transform: none; opacity: 1; } }

  /* inflation slider */
  .infl-wrap { padding: 4px 6px 2px; }
  .ylabel { text-align: center; font-family: var(--font-round); font-weight: 800; font-size: 1.1rem; color: var(--ink); margin-bottom: 4px; }
  input[type=range].big {
    -webkit-appearance: none; appearance: none; width: 100%; height: 16px; border-radius: 999px;
    background: var(--card-edge); outline: none; margin: 10px 0;
  }
  input[type=range].big::-webkit-slider-thumb { -webkit-appearance: none; width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--gold), var(--gold-deep)); border: 4px solid var(--card); box-shadow: var(--shadow-sm); cursor: pointer; }
  input[type=range].big::-moz-range-thumb { width: 38px; height: 38px; border-radius: 50%; background: var(--gold); border: 4px solid var(--card); cursor: pointer; }

  /* confetti + overlay */
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; display: none; }
  .overlay { position: fixed; inset: 0; z-index: 70; display: none; place-items: center; padding: 20px; background: rgba(20,30,55,.55); backdrop-filter: blur(3px); }
  .overlay.on { display: grid; animation: fadein .3s; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .reward {
    background: var(--card); border-radius: 30px; padding: 30px 26px; text-align: center; max-width: 380px; width: 100%;
    box-shadow: var(--shadow); animation: popin .45s cubic-bezier(.2,1.3,.4,1);
  }
  .reward .bigstar { font-size: 4.5rem; animation: pop 0.6s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes pop { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.25) rotate(8deg); } 100% { transform: scale(1); } }
  .reward h2 { font-size: 1.7rem; margin: 6px 0 4px; color: var(--ink); }
  .reward p { color: var(--ink-soft); font-weight: 600; margin: 0 0 18px; font-size: 1.05rem; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001s !important; animation-iteration-count: 1 !important; }
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="confetti" aria-hidden="true"></canvas>

<div class="app">
  <div class="bar">
    <span class="logo"><span class="dot"></span> La Aventura del Dinero</span>
    <button class="iconbtn" id="soundBtn" title="Sonido" aria-label="Activar o silenciar el sonido">🔊</button>
    <button class="iconbtn" id="themeBtn" title="Día o noche" aria-label="Cambiar entre día y noche">🌙</button>
  </div>

  <!-- HOME -->
  <section id="home">
    <div class="hero">
      <div class="mascot-wrap"><div class="mascot" id="heroMascot"></div></div>
      <h1>La Aventura del <span class="amar">Dinero</span></h1>
      <p class="sub">Cuatro historias para descubrir los secretos del dinero. ¡Te guía <b>Monedita</b>!</p>
      <div class="progress-chip">Tus estrellas: <span class="stars" id="homeStars">☆☆☆☆</span></div>
    </div>
    <div class="cards" id="cards"></div>
    <p class="home-foot">Toca una historia para empezar 👆</p>
    <p class="home-foot" style="margin-top:14px"><a href="index.html" id="toTeens" style="color:var(--ink-soft);font-weight:800;text-decoration:none;border-bottom:2px dotted var(--ink-soft)">¿Eres mayor? Ve al Manual del Dinero →</a></p>
  </section>

  <!-- STORY STAGE -->
  <section class="stage" id="stage" aria-live="polite">
    <div class="story-head">
      <button class="iconbtn" id="backBtn" aria-label="Volver al inicio">↩︎</button>
      <strong class="round" id="storyTitle" style="font-size:1.15rem;"></strong>
      <div class="dots" id="dots"></div>
    </div>
    <div class="scene" id="scene"></div>
    <div class="bubble"><div class="mini" id="miniMascot"></div><div class="say" id="say"></div></div>
    <div id="interaction"></div>
    <div class="controls" id="controls"></div>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="reward" id="reward"></div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------- SVG building blocks ---------------- */
  var DEFS = '<defs>' +
    '<radialGradient id="gold" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#FFE38A"/><stop offset="55%" stop-color="#FFC63D"/><stop offset="100%" stop-color="#E89B1E"/></radialGradient>' +
    '<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9BDBFF"/><stop offset="100%" stop-color="#D7F1FF"/></linearGradient>' +
    '<linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#78DC97"/><stop offset="100%" stop-color="#48C277"/></linearGradient>' +
    '</defs>';

  function coin(cx, cy, r, label) {
    label = label == null ? '€' : label;
    return '<g><circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="url(#gold)" stroke="#E89B1E" stroke-width="' + (r * 0.12) + '"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r * 0.72) + '" fill="none" stroke="#F3B733" stroke-width="' + (r * 0.1) + '" opacity=".7"/>' +
      '<text x="' + cx + '" y="' + (cy + r * 0.34) + '" font-size="' + (r * 1.05) + '" text-anchor="middle" fill="#B9780F" font-family="SF Pro Rounded, Arial Rounded MT Bold, sans-serif" font-weight="800">' + label + '</text>' +
      '<ellipse cx="' + (cx - r * 0.33) + '" cy="' + (cy - r * 0.4) + '" rx="' + (r * 0.22) + '" ry="' + (r * 0.12) + '" fill="#fff" opacity=".55"/></g>';
  }

  // Monedita mascot (coin with a happy face). mood: 'happy'|'sad'|'wow'
  function monedita(mood) {
    mood = mood || 'happy';
    var mouth = mood === 'sad'
      ? '<path d="M38 66 Q50 58 62 66" stroke="#9A5B0C" stroke-width="4" fill="none" stroke-linecap="round"/>'
      : mood === 'wow'
        ? '<ellipse cx="50" cy="64" rx="9" ry="11" fill="#9A5B0C"/>'
        : '<path d="M37 60 Q50 74 63 60" stroke="#9A5B0C" stroke-width="4.5" fill="none" stroke-linecap="round"/>';
    var eyes = mood === 'wow'
      ? '<circle cx="39" cy="46" r="6.5" fill="#3A2606"/><circle cx="61" cy="46" r="6.5" fill="#3A2606"/>'
      : '<circle cx="39" cy="46" r="5.5" fill="#3A2606"/><circle cx="61" cy="46" r="5.5" fill="#3A2606"/><circle cx="41" cy="44" r="2" fill="#fff"/><circle cx="63" cy="44" r="2" fill="#fff"/>';
    return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
      '<ellipse cx="50" cy="92" rx="26" ry="6" fill="#223355" opacity=".12"/>' +
      '<circle cx="50" cy="50" r="42" fill="url(#gold)" stroke="#E89B1E" stroke-width="5"/>' +
      '<circle cx="50" cy="50" r="33" fill="none" stroke="#F3B733" stroke-width="4" opacity=".7"/>' +
      '<ellipse cx="34" cy="34" rx="10" ry="6" fill="#fff" opacity=".5"/>' +
      '<circle cx="31" cy="52" r="7" fill="#FF9ECb" opacity=".65"/><circle cx="69" cy="52" r="7" fill="#FF9ECb" opacity=".65"/>' +
      eyes + mouth +
      '</svg>';
  }

  // simple kid character
  function kid(x, y, s, color, face) {
    color = color || '#7A63F0'; face = face || 'happy';
    var m = face === 'sad' ? '<path d="M-5 9 Q0 5 5 9" stroke="#5a3d2a" stroke-width="2" fill="none" stroke-linecap="round"/>'
      : '<path d="M-5 6 Q0 12 5 6" stroke="#5a3d2a" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
    return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">' +
      '<ellipse cx="0" cy="54" rx="26" ry="7" fill="#223355" opacity=".12"/>' +
      '<path d="M-20 52 L-15 20 Q0 10 15 20 L20 52 Z" fill="' + color + '"/>' +
      '<circle cx="0" cy="-4" r="20" fill="#FFD9B3"/>' +
      '<path d="M-20 -8 Q-18 -30 0 -30 Q18 -30 20 -8 Q10 -20 0 -18 Q-10 -20 -20 -8Z" fill="#6B4A2E"/>' +
      '<circle cx="-7" cy="-4" r="2.6" fill="#3A2606"/><circle cx="7" cy="-4" r="2.6" fill="#3A2606"/>' +
      '<circle cx="-11" cy="2" r="4" fill="#FF9ECb" opacity=".5"/><circle cx="11" cy="2" r="4" fill="#FF9ECb" opacity=".5"/>' +
      '<g transform="translate(0,4)">' + m + '</g>' +
      '</g>';
  }

  function shoemaker(x, y, s, face) {
    var m = face === 'sad' ? '<path d="M-6 10 Q0 6 6 10" stroke="#5a3d2a" stroke-width="2.4" fill="none" stroke-linecap="round"/>'
      : '<path d="M-6 7 Q0 13 6 7" stroke="#5a3d2a" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
    return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">' +
      '<ellipse cx="0" cy="56" rx="28" ry="7" fill="#223355" opacity=".12"/>' +
      '<path d="M-22 54 L-17 18 Q0 8 17 18 L22 54 Z" fill="#E85A3C"/>' +
      '<circle cx="0" cy="-6" r="21" fill="#F0C098"/>' +
      '<rect x="-22" y="-26" width="44" height="12" rx="5" fill="#4a3220"/><rect x="-14" y="-40" width="28" height="18" rx="6" fill="#4a3220"/>' +
      '<circle cx="-7" cy="-7" r="2.7" fill="#3A2606"/><circle cx="7" cy="-7" r="2.7" fill="#3A2606"/>' +
      '<path d="M-10 4 Q0 10 10 4" stroke="#6B4A2E" stroke-width="3" fill="none" stroke-linecap="round"/>' +
      '<g transform="translate(0,2)">' + m + '</g>' +
      '</g>';
  }

  function shoe(x, y, s) { s = s || 1; return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')"><path d="M-22 6 Q-24 -8 -10 -8 L0 -8 Q6 -2 16 0 Q26 2 24 10 L-20 10 Q-24 10 -22 6Z" fill="#3B6FE0" stroke="#2A54B8" stroke-width="2"/><path d="M-10 -8 L-6 2" stroke="#fff" stroke-width="2"/></g>'; }

    var touched = false;
    function render() {
      var y = +$('yrs').value;            // 0 = hace 30 años, 30 = ahora
      var price = (1 + y * (2 / 30));     // 1€ -> 3€
      var scoops = Math.max(1, Math.round(3 - (y / 30) * 2)); // same coin buys 3 -> 1 scoops
      $('yl').textContent = y === 0 ? 'Hace 30 años' : y >= 30 ? '¡Hoy!' : 'Hace ' + (30 - y) + ' años';
      var who = y < 15 ? kid(300, 150, 1.3, '#9A86FF', 'happy') : kid(300, 150, 1.3, '#9A86FF');
      var inner = iceCream(120, 150, 1.7, 3) +
        '<g transform="translate(120,70)"><rect x="-34" y="-20" width="68" height="40" rx="10" fill="#fff" stroke="#E85A3C" stroke-width="3"/>' +
        '<text x="0" y="9" font-size="24" text-anchor="middle" fill="#E85A3C" font-weight="800" font-family="SF Pro Rounded,sans-serif">' + price.toFixed(1).replace('.', ',') + '€</text></g>' +
        '<text x="300" y="206" font-size="12" text-anchor="middle" fill="#5E6E8C" font-weight="700" font-family="SF Pro Rounded,sans-serif">con 1 moneda: ' + scoops + ' bola' + (scoops > 1 ? 's' : '') + '</text>' +
        coin(300, 92, 13, '') + iceCream(300, 150, 1.0 + 0.15 * scoops, scoops);
      $('scene').style.display = ''; $('scene').innerHTML = stageSVG(inner);
      if (!touched && y >= 28) { touched = true; $('iHint').innerHTML = '¿Ves? El mismo helado cuesta <b>más</b>, y con 1 moneda compras <b>menos</b>. ¡Eso es la inflación!'; unlockNext(); }
      else if (!touched) { $('iHint').textContent = 'Sigue deslizando hasta «¡Hoy!»…'; }
    }
    $('yrs').addEventListener('input', function () { render(); if (soundOn && Math.random() < 0.3) beep(400 + (+$('yrs').value) * 20, 0.05, 'sine', 0.05); });
    render();
  };

  // Story 4: grow the money tree
  INTERACT.crecer = function () {
    var box = $('interaction'); var year = 0, coins = 1;
    box.innerHTML =
      '<div style="text-align:center;margin:2px 0 6px"><span class="progress-chip">Año <b id="gy" style="color:var(--green-deep);margin:0 4px">0</b> · Monedas: <b id="gc" style="color:var(--gold-deep);margin-left:4px">1</b></span></div>' +
      '<div class="controls"><button class="btn" id="water">💧 Regar (pasa 1 año)</button></div>' +
      '<p class="hint" id="gHint">Planta tu moneda regándola. ¡A ver cuánto crece!</p>';
    function draw() { $('scene').style.display = ''; $('scene').innerHTML = stageSVG(tree(200, 185, year) + (year === 0 ? coin(200, 168, 12, '') : '')); }
    $('water').onclick = function () {
      if (year >= 6) return;
      year++; coins = Math.round(coins * 2); sCoin();
      $('gy').textContent = year; $('gc').textContent = coins;
      draw();
      if (year < 6) { $('gHint').innerHTML = '¡Está creciendo! Cada año tienes <b>el doble</b>. Riega otra vez 💧'; }
      else {
        confetti(1200);
        $('gHint').innerHTML = '🌳 ¡Un bosque de <b>' + coins + ' monedas</b>! Empezaste con 1. Esto es el <b>interés compuesto</b>.';
        $('water').setAttribute('disabled', 'true'); $('water').textContent = '¡Ya es enorme! 🌳';
        unlockNext();
      }
    };
    draw();
  };

  /* ---------------- Confetti ---------------- */
  var cc = $('confetti'), ccx = cc.getContext('2d'), parts = [], raf = null, stopAt = 0;
  function sizeCC() { cc.width = window.innerWidth; cc.height = window.innerHeight; }
  sizeCC(); window.addEventListener('resize', function () { sizeCC(); sizeSky(); });
  function confetti(ms) {
    if (reduce) return;
    ms = ms || 1200; stopAt = Date.now() + ms; cc.style.display = 'block';
    var cols = ['#FFC63D', '#FF7A5C', '#46C877', '#43B2FF', '#9A86FF', '#FF9ECb'];
    for (var i = 0; i < 90; i++) parts.push({ x: Math.random() * cc.width, y: -20 - Math.random() * cc.height * 0.3, r: 4 + Math.random() * 7, c: cols[i % cols.length], vy: 2 + Math.random() * 4, vx: -2 + Math.random() * 4, a: Math.random() * 6, va: -0.2 + Math.random() * 0.4 });
    if (!raf) loop();
  }
  function loop() {
    ccx.clearRect(0, 0, cc.width, cc.height);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i]; p.x += p.vx; p.y += p.vy; p.a += p.va; p.vy += 0.05;
      ccx.save(); ccx.translate(p.x, p.y); ccx.rotate(p.a);
      ccx.fillStyle = p.c; ccx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 0.6); ccx.restore();
      if (p.y > cc.height + 30) parts.splice(i, 1);
    }
    if (parts.length > 0 || Date.now() < stopAt) { raf = requestAnimationFrame(loop); }
    else { raf = null; cc.style.display = 'none'; ccx.clearRect(0, 0, cc.width, cc.height); }
  }

  /* ---------------- Sky ambient (floating coins + clouds) ---------------- */
  var sky = $('sky'), sx = sky.getContext('2d'), floats = [];
  function sizeSky() { sky.width = window.innerWidth; sky.height = window.innerHeight; }
  sizeSky();
  for (var i = 0; i < 14; i++) floats.push({ x: Math.random(), y: Math.random(), r: 8 + Math.random() * 14, s: 0.08 + Math.random() * 0.12, t: Math.random() * 6 });
  function skyLoop() {
    sx.clearRect(0, 0, sky.width, sky.height);
    for (var k = 0; k < floats.length; k++) {
      var f = floats[k]; f.y -= f.s / 140; f.t += 0.01; if (f.y < -0.05) { f.y = 1.05; f.x = Math.random(); }
      var x = (f.x * sky.width) + Math.sin(f.t) * 14, y = f.y * sky.height;
      sx.globalAlpha = 0.5;
      sx.beginPath(); sx.arc(x, y, f.r, 0, Math.PI * 2);
      sx.fillStyle = '#FFC63D'; sx.fill();
      sx.globalAlpha = 0.9; sx.fillStyle = '#E89B1E'; sx.font = 'bold ' + f.r + 'px SF Pro Rounded, sans-serif'; sx.textAlign = 'center'; sx.textBaseline = 'middle';
      sx.fillText('€', x, y + 1);
    }
    sx.globalAlpha = 1;
    if (!reduce) requestAnimationFrame(skyLoop);
  }
  if (!reduce) skyLoop();

  /* ---------------- Controls: theme + sound + back ---------------- */
  function curDark() { var t = document.documentElement.getAttribute('data-theme'); if (t) return t === 'dark'; return window.matchMedia('(prefers-color-scheme: dark)').matches; }
  function syncTheme() { $('themeBtn').textContent = curDark() ? '☀️' : '🌙'; }
  $('themeBtn').addEventListener('click', function () { document.documentElement.setAttribute('data-theme', curDark() ? 'light' : 'dark'); syncTheme(); sPop(); });
  try { var savedT = localStorage.getItem('aventura:theme'); if (savedT) document.documentElement.setAttribute('data-theme', savedT); } catch (e) {}
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);
  syncTheme();
  $('themeBtn').addEventListener('click', function () { try { localStorage.setItem('aventura:theme', curDark() ? 'dark' : 'light'); } catch (e) {} });

  function syncSound() { $('soundBtn').textContent = soundOn ? '🔊' : '🔇'; }
  $('soundBtn').addEventListener('click', function () { soundOn = !soundOn; try { localStorage.setItem('aventura:sound', soundOn ? '1' : '0'); } catch (e) {} syncSound(); if (soundOn) sCoin(); });
  syncSound();

  $('backBtn').addEventListener('click', function () { sPop(); renderHome(); });

  /* ---------------- Go ---------------- */
  renderHome();
})();
</script>
</body>
</html>
